<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MPEPro — Atendimentos</title>
<style>
:root{--bg:#111b21;--panel:#202c33;--hover:#2a3942;--border:#3b4a54;--text:#e9edef;--sub:#8696a0;--green:#00a884;--orange:#f59e0b;--red:#ef4444;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden;}
.sidebar{width:360px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.top{background:#1f2c34;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.logo{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#00a884,#128c7e);display:flex;align-items:center;justify-content:center;font-size:18px;}
.title{font-size:15px;font-weight:600;margin-left:10px;}
.live{display:flex;align-items:center;gap:5px;background:#1a3a2a;border:1px solid var(--green);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--green);}
.ldot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.rbtn{background:none;border:none;color:var(--sub);cursor:pointer;font-size:22px;}
.stats{display:flex;padding:8px 12px;gap:6px;background:#1a2530;border-bottom:1px solid var(--border);}
.sc{flex:1;background:var(--bg);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .2s;}
.sc.at{border-color:#3b82f6;background:#1e2d47;}.sc.ap{border-color:var(--orange);background:#2d1f0a;}.sc.ar{border-color:var(--green);background:#0a1f14;}
.sn{font-size:18px;font-weight:700;}.sn.b{color:#60a5fa;}.sn.o{color:var(--orange);}.sn.g{color:var(--green);}
.sl{font-size:10px;color:var(--sub);margin-top:1px;}
.sw{padding:8px 12px;border-bottom:1px solid var(--border);}
.sb{background:var(--bg);border-radius:8px;padding:8px 14px;display:flex;align-items:center;gap:8px;}
.sb input{background:none;border:none;outline:none;color:var(--text);font-size:14px;width:100%;}
.sb input::placeholder{color:var(--sub);}
.list{flex:1;overflow-y:auto;}
.list::-webkit-scrollbar{width:5px;}
.list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.ci{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid #1a2530;transition:background .15s;}
.ci:hover{background:var(--hover);}.ci.active{background:#2a3942;}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0;position:relative;}
.udot{position:absolute;top:0;right:0;width:12px;height:12px;background:var(--green);border-radius:50%;border:2px solid var(--panel);}
.cb{flex:1;min-width:0;}
.r1{display:flex;justify-content:space-between;margin-bottom:3px;}
.cn{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ct{font-size:11px;color:var(--sub);flex-shrink:0;margin-left:8px;}
.r2{display:flex;justify-content:space-between;align-items:center;}
.cp{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;flex-shrink:0;margin-left:6px;}
.bp{background:#422006;color:#fbbf24;}.brv{background:#052e16;color:#34d399;}
.empty{display:flex;align-items:center;justify-content:center;height:150px;color:var(--sub);font-size:13px;}
.cpanel{flex:1;display:flex;flex-direction:column;background:#0b141a;}
.cempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sub);gap:16px;}
.cempty .bi{font-size:80px;opacity:.15;}
.cempty h3{font-size:22px;font-weight:300;color:#aebac1;}
.ch{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.chav{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;}
.chi{flex:1;}.chn{font-size:15px;font-weight:500;}.chs{font-size:12px;color:var(--sub);margin-top:2px;}
.hbtn{background:none;border:1px solid var(--green);color:var(--green);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
.hbtn:disabled{border-color:var(--border);color:var(--sub);cursor:not-allowed;}
.msgs{flex:1;overflow-y:auto;padding:20px 8%;display:flex;flex-direction:column;gap:6px;}
.msgs::-webkit-scrollbar{width:5px;}
.msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.dsep{text-align:center;margin:10px 0;}.dsep span{background:#182229;color:var(--sub);font-size:12px;padding:5px 12px;border-radius:8px;}
.bw{display:flex;margin-bottom:2px;}.bw.r{justify-content:flex-end;}
.bub{max-width:65%;padding:8px 12px 6px;border-radius:8px;font-size:14px;line-height:1.55;word-break:break-word;}
.inc{background:var(--panel);border-radius:0 8px 8px 8px;}.out{background:#005c4b;border-radius:8px 0 8px 8px;}
.bsender{font-size:11px;font-weight:600;margin-bottom:3px;}.bsender.al{color:#60a5fa;}.bsender.bot{color:#34d399;}
.bmeta{display:flex;justify-content:flex-end;margin-top:4px;}
.btime{font-size:11px;color:rgba(255,255,255,.4);}
.cia{background:var(--panel);border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:flex-end;gap:10px;flex-shrink:0;}
.cta{flex:1;background:#2a3942;border:none;border-radius:10px;padding:11px 16px;color:var(--text);font-size:14px;resize:none;outline:none;font-family:inherit;max-height:150px;line-height:1.5;}
.cta::placeholder{color:var(--sub);}
.sndbtn{width:46px;height:46px;border-radius:50%;background:var(--green);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sndbtn:disabled{background:var(--border);cursor:not-allowed;}
.cc{text-align:center;color:var(--sub);font-size:13px;padding:16px;background:var(--panel);border-top:1px solid var(--border);}
.crm{width:260px;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:none;}
.crm-h{padding:14px 16px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;}
.crm-sec{padding:12px 16px;border-bottom:1px solid var(--border);}
.crm-t{font-size:9px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;font-weight:700;}
.cf{margin-bottom:7px;}.cf label{font-size:10px;color:var(--sub);display:block;margin-bottom:2px;}.cf span{font-size:13px;color:var(--text);}
.cst{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.cst.pendente{background:#422006;color:#fbbf24;}.cst.resolvido{background:#052e16;color:#34d399;}
.cav{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;margin:0 auto 10px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:#182229;border:1px solid var(--border);border-radius:12px;padding:12px 20px;font-size:13px;z-index:999;transition:transform .3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}.toast.s{border-color:var(--green);color:#34d399;}.toast.e{border-color:var(--red);color:#f87171;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="sidebar">
  <div class="top">
    <div style="display:flex;align-items:center;"><div class="logo">💬</div><span class="title">Atendimentos</span></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="live"><div class="ldot"></div>Ao vivo</div>
      <button class="rbtn" id="rbtn" title="Atualizar">↻</button>
    </div>
  </div>
  <div class="stats">
    <div class="sc at" id="sc0"><div class="sn b" id="n0">0</div><div class="sl">Total</div></div>
    <div class="sc" id="sc1"><div class="sn o" id="n1">0</div><div class="sl">Pendentes</div></div>
    <div class="sc" id="sc2"><div class="sn g" id="n2">0</div><div class="sl">Resolvidos</div></div>
  </div>
  <div class="sw"><div class="sb"><span style="color:var(--sub)">🔍</span><input type="text" id="q" placeholder="Buscar conversa..."/></div></div>
  <div class="list" id="list"><div class="empty">⏳ Carregando...</div></div>
</div>
<div class="cpanel" id="cpanel">
  <div class="cempty"><div class="bi">💬</div><h3>MPEPro Atendimentos</h3><p>Selecione uma conversa</p></div>
</div>
<div class="crm" id="crm"></div>
<script>
var API='https://jhon-a2f274aa.base44.app/functions/crm';
var all=[],fil='todos',selId=null,sending=false;
function fmt(d){if(!d)return'';var dt=new Date(d),h=new Date();if(dt.toDateString()===h.toDateString())return dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});return dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
function fmtFull(d){if(!d)return'';return new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});}
function ini(n){if(!n)return'?';return n.split(' ').filter(Boolean).map(function(x){return x[0];}).slice(0,2).join('').toUpperCase();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function getSel(){return all.find(function(x){return x.id===selId;})||null;}
function toast(m,t){var e=document.getElementById('toast');e.textContent=(t==='e'?'❌ ':'✅ ')+m;e.className='toast show '+(t==='e'?'e':'s');setTimeout(function(){e.className='toast';},3000);}
function updateStats(){document.getElementById('n0').textContent=all.length;document.getElementById('n1').textContent=all.filter(function(x){return x.status==='pendente';}).length;document.getElementById('n2').textContent=all.filter(function(x){return x.status==='resolvido';}).length;}
function setF(f){fil=f;[['todos','at'],['pendente','ap'],['resolvido','ar']].forEach(function(x,i){document.getElementById('sc'+i).className='sc'+(f===x[0]?' '+x[1]:'');});render();}
function render(){
  var q=(document.getElementById('q').value||'').toLowerCase();
  var lst=all.filter(function(a){return(fil==='todos'||a.status===fil)&&(!q||(a.nome_aluno||'').toLowerCase().indexOf(q)>=0||(a.mensagem||'').toLowerCase().indexOf(q)>=0||(a.numero_aluno||'').indexOf(q)>=0);});
  var el=document.getElementById('list');
  if(!lst.length){el.innerHTML='<div class="empty">🔍 Nenhum resultado</div>';return;}
  el.innerHTML=lst.map(function(a){var p=a.status==='pendente';return'<div class="ci'+(a.id===selId?' active':'')+'" data-id="'+a.id+'"><div class="av">'+ini(a.nome_aluno)+(p?'<div class="udot"></div>':'')+'</div><div class="cb"><div class="r1"><span class="cn">'+esc(a.nome_aluno||'?')+'</span><span class="ct">'+fmt(a.data_contato)+'</span></div><div class="r2"><span class="cp">'+(p?'⏳ ':'✅ ')+esc(a.mensagem||'')+'</span><span class="badge '+(p?'bp':'brv')+'">'+(p?'Pendente':'Resolvido')+'</span></div></div></div>';}).join('');
  el.querySelectorAll('.ci').forEach(function(n){n.addEventListener('click',function(){sel(n.getAttribute('data-id'));});});
}
function sel(id){selId=id;render();var a=getSel();if(a){renderChat(a);renderCRM(a);}}
function renderChat(a){
  var p=document.getElementById('cpanel'),pend=a.status==='pendente';
  p.innerHTML='<div class="ch"><div class="chav">'+ini(a.nome_aluno)+'</div><div class="chi"><div class="chn">'+esc(a.nome_aluno||'?')+'</div><div class="chs">📞 '+esc(a.numero_aluno)+'</div></div><div>'+(pend?'<button class="hbtn" id="bres">✅ Resolver</button>':'<button class="hbtn" disabled>✅ Resolvido</button>')+'</div></div>'
  +'<div class="msgs" id="msgs"><div class="dsep"><span>'+fmtFull(a.data_contato)+'</span></div>'
  +'<div class="bw"><div class="bub inc"><div class="bsender al">👤 '+esc(a.nome_aluno||'Aluno')+'</div>'+esc(a.mensagem||'')+'<div class="bmeta"><span class="btime">'+fmt(a.data_contato)+'</span></div></div></div>'
  +'<div class="bw r"><div class="bub out"><div class="bsender bot">🤖 Bot</div>'+esc(a.resposta||'')+'<div class="bmeta"><span class="btime">'+fmt(a.data_contato)+'</span></div></div></div></div>'
  +(pend?'<div class="cia"><textarea class="cta" id="ti" rows="1" placeholder="Digite... (Enter envia)"></textarea><button class="sndbtn" id="sb">➤</button></div>':'<div class="cc">✅ Atendimento encerrado</div>');
  var msgs=document.getElementById('msgs');if(msgs)msgs.scrollTop=msgs.scrollHeight;
  var bres=document.getElementById('bres');if(bres)bres.addEventListener('click',resolver);
  var sb=document.getElementById('sb'),ti=document.getElementById('ti');
  if(sb)sb.addEventListener('click',send);
  if(ti){ti.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,150)+'px';});ti.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});}
}
function renderCRM(a){
  var crm=document.getElementById('crm');crm.style.display='block';
  crm.innerHTML='<div class="crm-h">📋 Ficha</div><div class="crm-sec" style="text-align:center"><div class="cav">'+ini(a.nome_aluno)+'</div><div style="font-size:15px;font-weight:600;margin-bottom:4px">'+esc(a.nome_aluno||'?')+'</div><div style="font-size:12px;color:var(--sub)">'+esc(a.numero_aluno||'')+'</div></div>'
  +'<div class="crm-sec"><div class="crm-t">Status</div><span class="cst '+a.status+'">'+(a.status==='pendente'?'⏳ Pendente':'✅ Resolvido')+'</span></div>'
  +'<div class="crm-sec"><div class="crm-t">Contato</div><div class="cf"><label>Telefone</label><span>'+esc(a.numero_aluno||'—')+'</span></div><div class="cf"><label>Data</label><span>'+fmtFull(a.data_contato)+'</span></div></div>'
  +'<div class="crm-sec"><div class="crm-t">Conversa</div><div class="cf"><label>Pergunta</label><span>'+esc(a.mensagem||'—')+'</span></div><div class="cf"><label>Resposta</label><span>'+esc(a.resposta||'—')+'</span></div></div>';
}
async function resolver(){
  var a=getSel();if(!a)return;var b=document.getElementById('bres');if(b){b.disabled=true;b.textContent='⏳...';}
  try{var r=await fetch(API+'?action=resolver&id='+a.id,{method:'POST'});var d=await r.json();if(d.error)throw new Error(d.error);toast('Resolvido!');a.status='resolvido';updateStats();render();renderChat(a);renderCRM(a);}
  catch(e){toast(e.message,'e');if(b){b.disabled=false;b.textContent='✅ Resolver';}}
}
async function send(){
  if(sending)return;var a=getSel();if(!a)return;var inp=document.getElementById('ti'),msg=inp?inp.value.trim():'';
  if(!msg){toast('Digite!','e');return;}sending=true;var b=document.getElementById('sb');if(b){b.disabled=true;b.innerHTML='<div class="spin"></div>';}
  try{var r=await fetch(API+'?action=responder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:a.id,phone:a.numero_aluno,mensagem:msg})});var d=await r.json();if(d.ok){toast('Enviado! 📤');a.resposta=msg;a.status='resolvido';if(inp)inp.value='';updateStats();render();renderChat(a);renderCRM(a);}else toast('Erro: '+(d.error||'?'),'e');}
  catch(e){toast('Erro','e');}
  sending=false;if(b){b.disabled=false;b.textContent='➤';}
}
async function reload(){
  try{var r=await fetch(API+'?action=list&t='+Date.now());var d=await r.json();if(Array.isArray(d)){all=d;updateStats();render();}}catch(e){console.error(e);}
}
document.getElementById('sc0').addEventListener('click',function(){setF('todos');});
document.getElementById('sc1').addEventListener('click',function(){setF('pendente');});
document.getElementById('sc2').addEventListener('click',function(){setF('resolvido');});
document.getElementById('q').addEventListener('input',render);
document.getElementById('rbtn').addEventListener('click',function(){reload().then(function(){toast('Atualizado!');});});
reload();
setInterval(reload,30000);
</script>
</body>
</html>
